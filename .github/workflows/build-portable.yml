name: Build Portable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx electron-builder --win portable --x64

      - uses: actions/upload-artifact@v4
        with:
          name: winbox-dl-portable
          path: release/*.exe
